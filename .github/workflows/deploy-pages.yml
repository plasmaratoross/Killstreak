# Deploys the BUILT game to GitHub Pages.
#
# Why this file has to exist: Pages was configured to serve the repository root,
# but the repository root holds the SOURCE, which no browser can run. index.html
# there points at `/src/main.js` — a path that (a) drops the `/Killstreak/` repo
# prefix and 404s, and (b) even if it resolved, would fail, because the source uses
# bare specifiers and `*.json` imports that Vite has to transform. The symptom is
# a fully rendered menu with completely dead JavaScript: the CSS links are relative,
# so the page still looks styled and healthy.
#
# Vite is the build step. It cannot be skipped, so the fix is to build here and
# publish only the output.
#
# `npm run build` is the single-file target: everything inlined into one
# dist/index.html with relative paths. That is deliberate — it works at ANY base
# path, so it survives a repo rename or a project site served from a subdirectory,
# which is exactly the class of bug this workflow exists to remove. `npm run
# build:web` would need base to be hard-coded to '/Killstreak/'.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish; nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` fails loudly if package-lock.json is out of sync with
      # package.json — which is what you want here, rather than a deploy that
      # silently installs different versions than the ones tested locally.
      - name: Install dependencies
        run: npm ci

      - name: Build the game
        run: npm run build

      - name: Confirm the build is self-contained
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          # The strongest self-containment check is simply that nothing else exists
          # to be referenced. It also catches accidentally deploying `build:web`,
          # whose output would need base hard-coded to '/Killstreak/' to work under
          # this site's subpath — the exact class of bug this workflow exists to fix.
          count=$(find dist -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "dist/ holds $count files; the Pages build must be one self-contained index.html."
            find dist -type f
            exit 1
          fi
          echo "dist/ is a single self-contained file ($(du -h dist/index.html | cut -f1))"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
